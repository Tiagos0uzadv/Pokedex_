<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Links -->
    <link rel="icon" href="src/img/favicon-16x16.png0" />
    <link rel="stylesheet" href="src/css/style.css" />

    <!-- Main JS -->
    <script defer src="src/script/script.js"></script>

    <title>Pokédex</title>
  </head>
  <body>
    <main>
      <img src="#" alt="pokemon" class="pokemon__image" />

      <h1 class="pokemon__data">
        <span class="pokemon__number"></span> -
        <span class="pokemon__name"></span>
      </h1>

      <form class="form">
        <input
          type="search"
          class="input__search"
          placeholder="Name or Number"
          required
        />
      </form>
      <button type="button" class="button btn-shiny">✨ Shiny</button>

      <div class="buttons">...</div>
      <div class="buttons">
        <button class="button btn-prev">Prev &lt;</button>
        <button class="button btn-next">Next &gt;</button>
      </div>

      <img src="src/img/pokedex.png" alt="pokedex" class="pokedex" />
    </main>
  </body>
</html>
